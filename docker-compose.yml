services:
  mysql:
    image: mysql:8.4
    environment:
      MYSQL_DATABASE: recoverai
      MYSQL_ROOT_PASSWORD: recoverai
    ports:
      - "3307:3306"
    volumes:
      - recoverai-mysql:/var/lib/mysql
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-precoverai"]
      interval: 5s
      timeout: 5s
      retries: 20

  backend:
    build:
      context: ./recoverai-backend
    environment:
      SPRING_DATASOURCE_URL: jdbc:mysql://mysql:3306/recoverai
      SPRING_DATASOURCE_USERNAME: root
      SPRING_DATASOURCE_PASSWORD: recoverai
      RECOVERAI_DEMO_SEED: "true"
      RECOVERAI_DEMO_RESET: ${RECOVERAI_DEMO_RESET:-false}
      RECOVERAI_PAYMENT_PROCESSING_MODE: ${RECOVERAI_PAYMENT_PROCESSING_MODE:-SIMULATED}
      RAZORPAY_WEBHOOK_SECRET: ${RAZORPAY_WEBHOOK_SECRET:-}
      GOOGLE_API_KEY: ${GOOGLE_API_KEY:-}
      GEMINI_API_KEY: ${GEMINI_API_KEY:-}
    ports:
      - "8081:8080"
    depends_on:
      mysql:
        condition: service_healthy

  frontend:
    build:
      context: ./recoverai-frontend/recoverai-frontend
      args:
        VITE_API_URL: http://localhost:8081
    ports:
      - "5173:80"
    depends_on:
      - backend

volumes:
  recoverai-mysql:
