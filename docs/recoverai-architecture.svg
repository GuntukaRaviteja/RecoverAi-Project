<svg xmlns="http://www.w3.org/2000/svg" width="1800" height="1200" viewBox="0 0 1800 1200" role="img" aria-labelledby="title desc">
  <title id="title">RecoverAI complete system architecture</title>
  <desc id="desc">Complete RecoverAI architecture from Razorpay webhooks and merchant users through React, Spring Boot services, AI policy decisions, recovery execution, MySQL, scheduler, and customer outreach.</desc>
  <defs>
    <linearGradient id="background" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#07111f"/>
      <stop offset="1" stop-color="#13243a"/>
    </linearGradient>
    <linearGradient id="accent" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#43d58c"/>
      <stop offset="1" stop-color="#42a9ff"/>
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="150%">
      <feDropShadow dx="0" dy="10" stdDeviation="12" flood-color="#000000" flood-opacity=".32"/>
    </filter>
    <marker id="arrow" markerWidth="12" markerHeight="12" refX="10" refY="6" orient="auto">
      <path d="M0 0L12 6L0 12Z" fill="#83a8d0"/>
    </marker>
    <style>
      .title{font:700 44px Inter,Arial,sans-serif;fill:#f5f8ff}
      .subtitle{font:400 19px Inter,Arial,sans-serif;fill:#a9bdd6}
      .section{font:700 15px Inter,Arial,sans-serif;letter-spacing:2.5px;fill:#66d995}
      .cardtitle{font:700 21px Inter,Arial,sans-serif;fill:#f5f8ff}
      .body{font:400 16px Inter,Arial,sans-serif;fill:#bfd0e4}
      .small{font:400 14px Inter,Arial,sans-serif;fill:#90a8c4}
      .tag{font:700 13px Inter,Arial,sans-serif;fill:#07111f}
      .arrow{stroke:#83a8d0;stroke-width:3;fill:none;marker-end:url(#arrow)}
      .dash{stroke-dasharray:9 8}
    </style>
  </defs>

  <rect width="1800" height="1200" fill="url(#background)"/>
  <circle cx="1610" cy="120" r="270" fill="#2d8a74" opacity=".14"/>
  <circle cx="130" cy="1090" r="280" fill="#286da5" opacity=".12"/>

  <text x="70" y="72" class="title">Recover<tspan fill="#42a9ff">AI</tspan></text>
  <text x="70" y="106" class="subtitle">Complete architecture · AI-guided payment recovery for higher merchant revenue</text>
  <rect x="1325" y="48" width="405" height="48" rx="24" fill="#f5f8ff"/>
  <text x="1527" y="79" text-anchor="middle" class="tag">RAZORPAY BUILDATHON · TRACK 03</text>

  <text x="70" y="158" class="section">1 · INPUTS AND ACTORS</text>
  <rect x="70" y="180" width="350" height="180" rx="18" fill="#192f49" stroke="#459be5" stroke-width="2" filter="url(#shadow)"/>
  <text x="98" y="222" class="cardtitle">Razorpay events</text>
  <text x="98" y="258" class="body">payment.failed</text>
  <text x="98" y="285" class="body">payment.authorized / captured</text>
  <text x="98" y="312" class="body">HTTPS webhook + HMAC-SHA256</text>
  <text x="98" y="340" class="small">Verified signature · masked reference only</text>

  <rect x="465" y="180" width="350" height="180" rx="18" fill="#17372d" stroke="#43d58c" stroke-width="2" filter="url(#shadow)"/>
  <text x="493" y="222" class="cardtitle">Merchant / operations team</text>
  <text x="493" y="258" class="body">Dashboard and analytics</text>
  <text x="493" y="285" class="body">Recovery case management</text>
  <text x="493" y="312" class="body">Revenue and safety monitoring</text>
  <text x="493" y="340" class="small">Browser user of the React application</text>

  <rect x="860" y="180" width="350" height="180" rx="18" fill="#3a301a" stroke="#e5b655" stroke-width="2" filter="url(#shadow)"/>
  <text x="888" y="222" class="cardtitle">Customer</text>
  <text x="888" y="258" class="body">Retry later</text>
  <text x="888" y="285" class="body">Promise to pay</text>
  <text x="888" y="312" class="body">Choose an alternative method</text>
  <text x="888" y="340" class="small">Customer-guided recovery replaces blind retries</text>

  <rect x="1255" y="180" width="475" height="180" rx="18" fill="#2c2141" stroke="#a17bea" stroke-width="2" filter="url(#shadow)"/>
  <text x="1283" y="222" class="cardtitle">External outreach providers</text>
  <text x="1283" y="258" class="body">Spring Mail / Gmail SMTP</text>
  <text x="1283" y="285" class="body">Twilio WhatsApp</text>
  <text x="1283" y="312" class="body">Audit-only fallback when disabled</text>
  <text x="1283" y="340" class="small">30-minute cooldown and promise-to-pay pause</text>

  <text x="70" y="420" class="section">2 · PRESENTATION AND API LAYER</text>
  <rect x="70" y="442" width="805" height="240" rx="20" fill="#0d1929" stroke="#315170" stroke-width="2"/>
  <rect x="98" y="480" width="340" height="165" rx="15" fill="#172d47" stroke="#4b9fe8" stroke-width="2"/>
  <text x="125" y="520" class="cardtitle">React + Vite frontend</text>
  <text x="125" y="554" class="body">Recovery Dashboard</text>
  <text x="125" y="580" class="body">Recovery Attempts</text>
  <text x="125" y="606" class="body">Payment Details</text>
  <text x="125" y="632" class="body">Analytics and benchmark</text>
  <rect x="475" y="480" width="360" height="165" rx="15" fill="#172d47" stroke="#4b9fe8" stroke-width="2"/>
  <text x="502" y="520" class="cardtitle">Axios API client</text>
  <text x="502" y="554" class="body">Payments and payment details</text>
  <text x="502" y="580" class="body">Recovery actions and history</text>
  <text x="502" y="606" class="body">Dashboard stats and trends</text>
  <text x="502" y="632" class="small">Configurable VITE_API_URL</text>

  <rect x="925" y="442" width="805" height="240" rx="20" fill="#0d1929" stroke="#315170" stroke-width="2"/>
  <rect x="953" y="480" width="335" height="165" rx="15" fill="#30213d" stroke="#a17bea" stroke-width="2"/>
  <text x="980" y="520" class="cardtitle">Spring Boot REST API</text>
  <text x="980" y="554" class="body">/api/payments</text>
  <text x="980" y="580" class="body">/api/ai-decisions</text>
  <text x="980" y="606" class="body">/api/recovery and attempts</text>
  <text x="980" y="632" class="body">/api/dashboard and audit logs</text>
  <rect x="1325" y="480" width="375" height="165" rx="15" fill="#30213d" stroke="#a17bea" stroke-width="2"/>
  <text x="1352" y="520" class="cardtitle">Webhook controller</text>
  <text x="1352" y="554" class="body">POST /api/webhooks/razorpay</text>
  <text x="1352" y="580" class="body">Verify signature</text>
  <text x="1352" y="606" class="body">Parse and persist event</text>
  <text x="1352" y="632" class="small">Trigger analysis for new failures</text>

  <path d="M640 360V470" class="arrow"/>
  <path d="M1650 360V470" class="arrow"/>
  <path d="M1035 360V430H1600V470" class="arrow dash"/>
  <path d="M420 270H455" class="arrow dash"/>
  <path d="M1210 270H1245" class="arrow dash"/>

  <text x="70" y="742" class="section">3 · DOMAIN AND DECISION ENGINE</text>
  <rect x="70" y="765" width="1660" height="250" rx="22" fill="#0d1929" stroke="#315170" stroke-width="2"/>

  <rect x="98" y="805" width="295" height="165" rx="15" fill="#192e47" stroke="#4b9fe8" stroke-width="2"/>
  <text x="125" y="845" class="cardtitle">Payment Service</text>
  <text x="125" y="879" class="body">Create and update payment</text>
  <text x="125" y="905" class="body">Determine failure category</text>
  <text x="125" y="931" class="body">Normalize customer context</text>
  <text x="125" y="957" class="small">Repository-backed persistence</text>

  <rect x="435" y="805" width="295" height="165" rx="15" fill="#302340" stroke="#a17bea" stroke-width="2"/>
  <text x="462" y="845" class="cardtitle">AI Decision Engine</text>
  <text x="462" y="879" class="body">Gemini structured JSON</text>
  <text x="462" y="905" class="body">Rule-based fallback</text>
  <text x="462" y="931" class="body">Decision + action + confidence</text>
  <text x="462" y="957" class="small">Explainable recommendation</text>

  <rect x="772" y="805" width="295" height="165" rx="15" fill="#17382f" stroke="#43d58c" stroke-width="2"/>
  <text x="799" y="845" class="cardtitle">Recovery Policy</text>
  <text x="799" y="879" class="body">Max 5 attempts</text>
  <text x="799" y="905" class="body">One active attempt</text>
  <text x="799" y="931" class="body">Block unsafe categories</text>
  <text x="799" y="957" class="small">AI recommends; policy decides</text>

  <rect x="1109" y="805" width="295" height="165" rx="15" fill="#3a301a" stroke="#e5b655" stroke-width="2"/>
  <text x="1136" y="845" class="cardtitle">Recovery Service</text>
  <text x="1136" y="879" class="body">Create and execute attempts</text>
  <text x="1136" y="905" class="body">Retry later / promise to pay</text>
  <text x="1136" y="931" class="body">Alternative payment method</text>
  <text x="1136" y="957" class="small">State transitions are audited</text>

  <rect x="1446" y="805" width="255" height="165" rx="15" fill="#2c2141" stroke="#a17bea" stroke-width="2"/>
  <text x="1473" y="845" class="cardtitle">Audit Service</text>
  <text x="1473" y="879" class="body">AI decisions</text>
  <text x="1473" y="905" class="body">State changes</text>
  <text x="1473" y="931" class="body">Outreach and outcomes</text>
  <text x="1473" y="957" class="small">Operational explainability</text>

  <path d="M393 887H425" class="arrow"/>
  <path d="M730 887H762" class="arrow"/>
  <path d="M1067 887H1099" class="arrow"/>
  <path d="M1404 887H1436" class="arrow"/>
  <path d="M1200 682V795H245V795" class="arrow"/>
  <path d="M1500 682V795" class="arrow"/>

  <text x="70" y="1080" class="section">4 · DATA, AUTOMATION, AND OUTCOMES</text>
  <rect x="70" y="1100" width="500" height="75" rx="15" fill="#35202c" stroke="#d86582" stroke-width="2"/>
  <text x="98" y="1145" class="cardtitle">MySQL · Payments · Decisions · Attempts · Audit logs</text>
  <rect x="650" y="1100" width="500" height="75" rx="15" fill="#3a301a" stroke="#e5b655" stroke-width="2"/>
  <text x="678" y="1145" class="cardtitle">Scheduler · due retries · 30-second polling</text>
  <rect x="1230" y="1100" width="500" height="75" rx="15" fill="url(#accent)"/>
  <text x="1258" y="1145" class="cardtitle" fill="#07111f">Outcomes · recovered INR · safety · visibility</text>
  <path d="M920 1015V1090" class="arrow"/>
  <path d="M1220 1015V1075H900V1090" class="arrow"/>
</svg>
