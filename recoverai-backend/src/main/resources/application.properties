spring.application.name=recoverai-backend

spring.datasource.url=jdbc:mysql://localhost:3306/recoverai
spring.datasource.username=root
spring.datasource.password=

spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false
spring.jpa.open-in-view=false
recoverai.demo.seed=${RECOVERAI_DEMO_SEED:true}
recoverai.demo.reset=${RECOVERAI_DEMO_RESET:false}

# Demo integrations: see README before connecting a payment or outreach provider.
recoverai.payment-processing.mode=${RECOVERAI_PAYMENT_PROCESSING_MODE:SIMULATED}
recoverai.outreach.mode=AUDIT_LOG_ONLY
recoverai.razorpay.webhook.secret=${RAZORPAY_WEBHOOK_SECRET:}

# Demo fallback contact values
recoverai.outreach.fallback-email=${RECOVERAI_DEMO_EMAIL:}
recoverai.outreach.fallback-whatsapp-number=${RECOVERAI_DEMO_WHATSAPP_NUMBER:}

# Email outreach
recoverai.outreach.email.enabled=${RECOVERAI_EMAIL_ENABLED:false}
recoverai.outreach.email.from-address=${RECOVERAI_EMAIL_FROM:}
spring.mail.host=${SMTP_HOST:smtp.gmail.com}
spring.mail.port=${SMTP_PORT:587}
spring.mail.username=${SMTP_USERNAME:}
spring.mail.password=${SMTP_APP_PASSWORD:}
spring.mail.properties.mail.smtp.auth=true
spring.mail.properties.mail.smtp.starttls.enable=true

# WhatsApp outreach
recoverai.outreach.whatsapp.enabled=${RECOVERAI_WHATSAPP_ENABLED:false}
recoverai.outreach.whatsapp.account-sid=${TWILIO_ACCOUNT_SID:}
recoverai.outreach.whatsapp.auth-token=${TWILIO_AUTH_TOKEN:}
recoverai.outreach.whatsapp.from-number=${TWILIO_WHATSAPP_FROM:}
recoverai.outreach.whatsapp.content-sid=${TWILIO_WHATSAPP_CONTENT_SID:}
